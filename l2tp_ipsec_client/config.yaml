name: "L2TP/IPsec Client – C6 átjáró"
version: "0.1.0"
slug: l2tp_ipsec_client
description: "Kísérleti L2TP/IPsec PSK kliens, belső TCP-átjáróval az eBUS C6 adapterhez."
arch:
  - amd64
startup: services
boot: manual
init: false
stage: experimental
host_network: false
# Prototype: /dev/ppp access/creation and loading existing host kernel modules.
# This is broad hardware/kernel access. See SECURITY.md before disabling protection.
full_access: true
kernel_modules: true
apparmor: false
tmpfs: true
timeout: 30
ports:
  9999/tcp: null
ports_description:
  9999/tcp: "Belső C6 TCP-átjáró; LAN-port közzététele alapból kikapcsolva."
options:
  diagnostics_only: true
  vpn_server: ""
  vpn_username: ""
  vpn_password: ""
  vpn_psk: ""
  adapter_ip: ""
  adapter_port: 9999
  ppp_auth: mschapv2
  legacy_compatibility: false
  mtu: 1400
  retry_delay: 60
  max_retries: 3
  allowed_clients:
    - "172.30.32.0/23"
    - "127.0.0.1/32"
schema:
  diagnostics_only: bool
  vpn_server: str
  vpn_username: str
  vpn_password: password
  vpn_psk: password
  adapter_ip: str
  adapter_port: port
  ppp_auth: "list(mschapv2|chap|pap|auto)"
  legacy_compatibility: bool
  mtu: "int(1280,1460)"
  retry_delay: "int(30,600)"
  max_retries: "int(1,10)"
  allowed_clients:
    - str
