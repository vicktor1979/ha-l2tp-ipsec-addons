configuration:
  diagnostics_only:
    name: Csak diagnosztika
    description: TUN és motor ellenőrzése. Igaz értéknél nincs VPN-bejelentkezés;
      elsőre maradjon bekapcsolva.
  vpn_server:
    name: VPN-szerver IPv4-címe
    description: A Windows-kapcsolat szervercíme. Itt IPv4 kell, nem URL vagy domainnév.
  vpn_username:
    name: VPN-felhasználónév
    description: A meglévő L2TP/IPsec felhasználóneved. Ne tedd GitHubra.
  vpn_password:
    name: VPN-jelszó
    description: A felhasználóhoz tartozó jelszó, nem az IPsec megosztott kulcs.
  vpn_psk:
    name: IPsec megosztott kulcs (PSK)
    description: A Windowsban külön megadott L2TP/IPsec közös kulcs.
  adapter_ip:
    name: C6 adapter távoli IPv4-címe
    description: Csak proxy módban szükséges. VPN-próbánál és keresésnél üresen hagyható.
  adapter_port:
    name: Adapter TCP-portja
    description: Alapértelmezés 9999. Az addon helyi proxyportja ettől függetlenül
      9999.
  ppp_auth:
    name: PPP-hitelesítés
    description: A 0.2.0 kizárólag az mschapv2 értéket támogatja. A többi örökölt
      választás hibával leáll.
  legacy_compatibility:
    name: Régi kompatibilitási kapcsoló – ne használd
    description: A 0.2.0-ban nem támogatott. Maradjon false/kikapcsolva.
  mtu:
    name: VPN MTU
    description: 1280–1460; alapérték 1400. Csak az addon TUN-interfészét érinti.
  retry_delay:
    name: Újrapróbálkozások közötti idő
    description: Másodperc, minimum 30. Alapból 60.
  max_retries:
    name: Legfeljebb ennyi kapcsolódási kísérlet
    description: Egy addonindításon belüli korlát. Az azonosított hitelesítési hiba
      azonnali leállást okoz.
  allowed_clients:
    name: Engedélyezett TCP-kliensek
    description: IPv4/CIDR lista. Másik HA-géphez annak helyi IP-címét /32 végződéssel
      add hozzá.
  connection_mode:
    name: Működési mód
    description: 'proxy: ismert adapter; vpn_test: csak VPN-próba; discover: egyszeri
      keresés. A teszt és keresés után leáll.'
  discovery_networks:
    name: Keresendő távoli hálózatok
    description: Csak discover módban. Saját/engedélyezett távoli CIDR, például 192.168.50.0/24.
      Legfeljebb 1024 cím; nincs automatikus találgatás.
  discovery_ports:
    name: Keresendő TCP-portok
    description: Alapérték 9999, 80, 443. Csak connect/close, parancs vagy webkérés
      küldése nélkül.
  ike_trace:
    name: IKE fejléc-diagnosztika
    description: IPsec kézfogás küldési/fogadási metaadatai. Nincs nyers csomag, jelszó,
      PSK, azonosító vagy hash naplózása.
network:
  9999/tcp: C6 TCP-átjáró. Csak másik HA-géphez tedd közzé, internetre ne.
