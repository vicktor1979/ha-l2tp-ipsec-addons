configuration:
  diagnostics_only:
    name: Diagnostics only
    description: Test TUN and engine startup without VPN login. Keep enabled for the
      first run.
  vpn_server:
    name: VPN server IPv4 address
    description: The Windows VPN server address; an IPv4 address, not a URL or hostname.
  vpn_username:
    name: VPN username
    description: Your existing VPN username. Never upload it to GitHub.
  vpn_password:
    name: VPN password
    description: The user password, not the IPsec shared key.
  vpn_psk:
    name: IPsec pre-shared key (PSK)
    description: The separately configured L2TP/IPsec shared key.
  adapter_ip:
    name: Remote C6 IPv4 address
    description: Required only in proxy mode; may be empty for VPN test/discovery.
  adapter_port:
    name: Adapter TCP port
    description: Default 9999. The local addon relay always listens on container port
      9999.
  ppp_auth:
    name: PPP authentication
    description: Version 0.2.0 supports mschapv2 only. Other retained migration values
      are rejected.
  legacy_compatibility:
    name: Legacy compatibility – unsupported
    description: Not supported by 0.2.0. Keep disabled/false.
  mtu:
    name: VPN MTU
    description: 1280–1460; default 1400. Applies only to the addon TUN interface.
  retry_delay:
    name: Retry delay
    description: Seconds, minimum 30, default 60.
  max_retries:
    name: Maximum connection attempts
    description: Per addon start. Recognized authentication errors stop immediately.
  allowed_clients:
    name: Allowed TCP clients
    description: IPv4/CIDR list. For another HA host, add its local IPv4 address with
      /32.
  connection_mode:
    name: Operation mode
    description: 'proxy: known adapter; vpn_test: VPN login only; discover: one-shot
      scan. Test/scan exit on completion.'
  discovery_networks:
    name: Remote discovery networks
    description: Discover mode only. Authorized remote CIDR, e.g. 192.168.50.0/24.
      Maximum 1024 addresses; never guessed.
  discovery_ports:
    name: TCP discovery ports
    description: Default 9999, 80, 443. Connect/close only, no application requests.
  ike_trace:
    name: IKE header diagnostics
    description: Handshake send/receive metadata only. No payloads, PSK, passwords,
      identities or hashes logged.
network:
  9999/tcp: C6 TCP relay. Publish only for another trusted HA host, never to the Internet.
